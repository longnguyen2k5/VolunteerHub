version: '4'
services:
  mysql:
    image: mysql:8.3.0
    container_name: database_backend
    ports:
      - "3336:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: volunteer_hub
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql