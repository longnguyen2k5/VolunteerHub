spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3336/volunteer_hub?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
server.port=8386

# Web Push VAPID Keys
# SECURITY NOTE: Do NOT hardcode keys here. Set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY in your Environment Variables.
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@volunteerhub.com