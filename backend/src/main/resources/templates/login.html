<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | VolunteerHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            pink: '#FE6B8B',
                            orange: '#FF8E53',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1559027615-cd4628902d4a?q=80&w=2074&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center relative">
    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black/70 z-0"></div>

    <div class="glass p-8 md:p-10 rounded-3xl w-full max-w-md relative z-10 mx-4">
        <div class="text-center mb-8">
            <h1
                class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-pink to-brand-orange mb-2">
                VolunteerHub
            </h1>
            <p class="text-gray-400 font-light">Đăng nhập để kết nối yêu thương</p>
        </div>

        <!-- Error Message -->
        <div th:if="${param.error}"
            class="bg-red-500/10 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl relative mb-6 text-sm"
            role="alert">
            <div class="flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-red-400" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                        clip-rule="evenodd" />
                </svg>
                <span th:if="${param.error[0] == 'locked'}" class="block sm:inline">Tài khoản đã bị khóa.</span>
                <span th:unless="${param.error[0] == 'locked'}" class="block sm:inline">Email hoặc mật khẩu không
                    đúng.</span>
            </div>
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}"
            class="bg-green-500/10 border border-green-500/50 text-green-200 px-4 py-3 rounded-xl relative mb-6 text-sm"
            role="alert">
            <span class="block sm:inline">Bạn đã đăng xuất thành công.</span>
        </div>

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">Email</label>
                <input type="email" id="username" name="username" required
                    class="w-full px-5 py-3 bg-black/20 border border-white/10 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition duration-200"
                    placeholder="name@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5 ml-1">Mật khẩu</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-5 py-3 bg-black/20 border border-white/10 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition duration-200"
                    placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between text-sm">
                <!-- <div class="flex items-center">
                    <input id="remember_me" name="remember-me" type="checkbox" 
                        class="h-4 w-4 text-brand-orange focus:ring-brand-orange border-gray-600 rounded bg-white/10">
                    <label for="remember_me" class="ml-2 block text-gray-400">Ghi nhớ đăng nhập</label>
                </div> -->
                <!-- <a href="#" class="font-medium text-brand-orange hover:text-brand-pink transition ml-auto">
                    Quên mật khẩu?
                </a> -->
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-brand-pink to-brand-orange hover:shadow-lg hover:shadow-brand-pink/30 text-white font-bold py-3.5 px-4 rounded-full transition duration-300 transform hover:-translate-y-0.5">
                Đăng nhập
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-sm text-gray-400">
                Chưa có tài khoản?
                <a href="http://localhost:3000/register"
                    class="font-semibold text-brand-orange hover:text-brand-pink transition">
                    Đăng ký ngay
                </a>
            </p>
            <div class="mt-6 pt-6 border-t border-white/10">
                <a href="http://localhost:3000/"
                    class="inline-flex items-center text-sm text-gray-500 hover:text-white transition group">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4 mr-2 group-hover:-translate-x-1 transition-transform" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Quay lại trang chủ
                </a>
            </div>
        </div>
    </div>
</body>

</html>
